services:

  postgres:
    image: postgres:15.8
    container_name: postgres_v1
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: company
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 01032002ama
    volumes:
      - /data/postgres:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5677:5672"
      - "15677:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest


  digital-active:
    build: .
    image: digital-active:${docker_VERSION}
    container_name: digital-active
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/company
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 01032002ama

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest

      BOT_TOKEN: ${BOT_TOKEN}
      BOT_NAME: ${BOT_NAME}

    depends_on:
      - postgres
      - rabbitmq