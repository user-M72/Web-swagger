version: '3.8'

services:

  digital-active:
    container_name: digital-active
    image: digital-active:latest
    restart: on-failure
    build:
      context: . # Context will be the project root
      dockerfile: Dockerfile
      args:
        version: ${VERSION}
    #    environment:
    #      POSTGRES_SERVER: postgres:5432
