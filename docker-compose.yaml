    #      TZ: Asia/Tashkent
    volumes: # NOTE: choose using local build or pre-built image (remove the volumes if pre-built)
      - ./build/libs/digital-active-${VERSION}.jar:/digital-active.jar
      - /opt/digital-active/log:/opt/digital-active/log
    ports:
      - "8080:8080"
